name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    - name: Build and Test
      run: mvn clean verify

    - name: Build Docker Image
      run: |
        docker build -t vaultstream:${{ github.sha }} .
        echo "VAULTSTREAM_IMAGE=vaultstream:${{ github.sha }}" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      run: |
        docker tag vaultstream:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/vaultstream:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/vaultstream:${{ github.sha }}
        # Also push as latest
        docker tag vaultstream:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/vaultstream:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/vaultstream:latest

    - name: Deploy to staging (if main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment logic here (e.g., kubectl, AWS ECS, etc.)
        echo "Staging deployment completed"

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.23.0
      with:
        image-ref: vaultstream:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'