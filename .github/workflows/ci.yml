name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React dashboard
        run: npm ci --prefix frontend --no-audit --no-fund && npm --prefix frontend run build

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build production container
        run: docker build --tag vaultstream:ci .

      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vaultstream:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  codeql:
    name: Source security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for analysis
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
