services:
  vaultstream-app:
    build: .
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vaultstream-db:5432/vaultstream
      - SPRING_DATASOURCE_USERNAME=vaultstream_user
      - SPRING_DATASOURCE_PASSWORD=vaultstream_pass
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-local-development-only-secret-please-override-in-deployments-0123456789}
      - VAULTSTREAM_ADMIN_USERNAME=${VAULTSTREAM_ADMIN_USERNAME:-}
      - VAULTSTREAM_ADMIN_PASSWORD=${VAULTSTREAM_ADMIN_PASSWORD:-}
      - SERVER_PORT=8081
    depends_on:
      - vaultstream-db
    restart: unless-stopped

  vaultstream-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vaultstream
      - POSTGRES_USER=vaultstream_user
      - POSTGRES_PASSWORD=vaultstream_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
