services:
  vaultstream-app:
    build: .
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vaultstream-db:5432/vaultstream
      - SPRING_DATASOURCE_USERNAME=vaultstream_user
      - SPRING_DATASOURCE_PASSWORD=vaultstream_pass
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key-in-production}
      - SERVER_PORT=8081
    depends_on:
      - vaultstream-db
    restart: unless-stopped

  vaultstream-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vaultstream
      - POSTGRES_USER=vaultstream_user
      - POSTGRES_PASSWORD=vaultstream_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

volumes:
  postgres_data: