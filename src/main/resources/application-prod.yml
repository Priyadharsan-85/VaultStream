spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultstream}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none  # Flyway handles schema migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m

vaultstream:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour
  monitoring:
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
          step: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    web:
      server:
        request:
          max-count: 1000

logging:
  level:
    root: INFO
    com.vaultstream: INFO
    org.springframework.web: INFO
    org.hibernate: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:./logs/vaultstream.log}
    max-size: 10MB
    max-history: 30
    total-size-cap: 100MB
    # JSON logging for production (uncomment if using logstash-logback-encoder)
    # charset: UTF-8
    # flushImmediately: true
