spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none  # Flyway handles schema migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  thymeleaf:
    cache: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m

vaultstream:
  ledger:
    manual-adjustments-enabled: ${VAULTSTREAM_LEDGER_MANUAL_ADJUSTMENTS_ENABLED:false}
    customer-transfers-enabled: ${VAULTSTREAM_CUSTOMER_TRANSFERS_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour
    allowed-origins: ${VAULTSTREAM_ALLOWED_ORIGINS}
    registration-enabled: ${VAULTSTREAM_REGISTRATION_ENABLED:false}
  monitoring:
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
          step: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    web:
      server:
        request:
          max-count: 1000

logging:
  level:
    root: INFO
    com.vaultstream: INFO
    org.springframework.web: INFO
    org.hibernate: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file:
    name: /tmp/vaultstream.log
