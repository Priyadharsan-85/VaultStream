server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:vaultstream-db}:${DB_PORT:5432}/${DB_NAME:vaultstream}
    username: ${DB_USERNAME:vaultstream_user}
    password: ${DB_PASSWORD:vaultstream_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: smtp.example.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Application specific properties
vaultstream:
  ledger:
    batch-size: 1000
    flush-interval-ms: 5000
    retry-attempts: 3
    retry-backoff-ms: 1000
  event-processing:
    thread-pool-size: 8
    queue-capacity: 10000
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-key-in-production}
    jwt-expiration-ms: 3600000
    bcrypt-strength: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,logfile
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    enable:
      http.server: true
      jvm: true
      logback: true
      process: true
      system: true

logging:
  level:
    com.vaultstream: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file:
    name: logs/vaultstream.log
    max-size: 10MB
    max-history: 30