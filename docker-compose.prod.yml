services:
  vaultstream-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_BOOTSTRAP_USERNAME:?Set DB_BOOTSTRAP_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?Set DB_MIGRATION_USERNAME}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-roles.sh:/docker-entrypoint-initdb.d/10-create-app-roles.sh:ro
    secrets:
      - db_bootstrap_password
      - db_migration_password
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  vaultstream-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaultstream:production
    restart: unless-stopped
    init: true
    depends_on:
      vaultstream-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://vaultstream-db:5432/${DB_NAME:?Set DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USERNAME:?Set DB_MIGRATION_USERNAME}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      VAULTSTREAM_ADMIN_USERNAME: ${VAULTSTREAM_ADMIN_USERNAME:?Set VAULTSTREAM_ADMIN_USERNAME}
      VAULTSTREAM_ALLOWED_ORIGINS: ${VAULTSTREAM_ALLOWED_ORIGINS:?Set VAULTSTREAM_ALLOWED_ORIGINS}
      VAULTSTREAM_REGISTRATION_ENABLED: ${VAULTSTREAM_REGISTRATION_ENABLED:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend
    secrets:
      - source: db_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: db_migration_password
        target: SPRING_FLYWAY_PASSWORD
      - source: jwt_secret
        target: JWT_SECRET
      - source: admin_password
        target: VAULTSTREAM_ADMIN_PASSWORD

volumes:
  postgres_data:

secrets:
  db_bootstrap_password:
    file: ${DB_BOOTSTRAP_PASSWORD_FILE:?Set DB_BOOTSTRAP_PASSWORD_FILE}
  db_migration_password:
    file: ${DB_MIGRATION_PASSWORD_FILE:?Set DB_MIGRATION_PASSWORD_FILE}
  db_password:
    file: ${DB_PASSWORD_FILE:?Set DB_PASSWORD_FILE}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?Set JWT_SECRET_FILE}
  admin_password:
    file: ${VAULTSTREAM_ADMIN_PASSWORD_FILE:?Set VAULTSTREAM_ADMIN_PASSWORD_FILE}

networks:
  backend:
    internal: true
