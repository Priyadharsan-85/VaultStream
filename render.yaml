services:
  - type: web
    name: vaultstream-demo
    runtime: docker
    branch: main
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/liveness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: VAULTSTREAM_REGISTRATION_ENABLED
        value: "false"
      - key: VAULTSTREAM_LEDGER_MANUAL_ADJUSTMENTS_ENABLED
        value: "false"
      - key: VAULTSTREAM_CUSTOMER_TRANSFERS_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VAULTSTREAM_ADMIN_USERNAME
        sync: false
      - key: VAULTSTREAM_ADMIN_PASSWORD
        sync: false
      - key: VAULTSTREAM_ALLOWED_ORIGINS
        fromService:
          type: web
          name: vaultstream-dashboard
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: vaultstream-dashboard
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vaultstream-demo
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
